(function(){
  var dragRow=null,ghost=null,dragGroup=null,startY=0,isDragging=false;
  teaPage.addEventListener("touchstart",function(e){
    var handle=e.target.closest(".drag-handle");if(!handle)return;
    var row=handle.closest(".tea-row");if(!row)return;
    dragGroup=row.closest(".tea-group");if(!dragGroup)return;
    dragRow=row;startY=e.touches[0].clientY;isDragging=false;
    e.preventDefault();
  },{passive:false});
  teaPage.addEventListener("touchmove",function(e){
    if(!dragRow)return;e.preventDefault();
    var ty=e.touches[0].clientY;
    if(!isDragging&&Math.abs(ty-startY)>8){
      isDragging=true;dragRow.classList.add("dragging");
      ghost=dragRow.cloneNode(true);ghost.classList.remove("dragging");ghost.classList.add("tea-ghost");
      ghost.style.width=dragRow.offsetWidth+"px";ghost.style.left=dragRow.getBoundingClientRect().left+"px";
      document.body.appendChild(ghost);
    }
    if(isDragging&&ghost){
      ghost.style.top=(ty-24)+"px";
      dragGroup.querySelectorAll(".tea-row").forEach(function(r){r.classList.remove("drop-above","drop-below");});
      var rows=Array.from(dragGroup.querySelectorAll(".tea-row"));
      for(var i=0;i<rows.length;i++){
        if(rows[i]===dragRow)continue;
        var rect=rows[i].getBoundingClientRect(),mid=rect.top+rect.height/2;
        if(ty>=rect.top-5&&ty<mid){rows[i].classList.add("drop-above");break;}
        else if(ty>=mid&&ty<=rect.bottom+5){rows[i].classList.add("drop-below");break;}
      }
    }
  },{passive:false});
  teaPage.addEventListener("touchend",function(){
    if(!dragRow)return;
    if(isDragging){
      var target=dragGroup.querySelector(".drop-above,.drop-below");
      if(target&&target!==dragRow){
        if(target.classList.contains("drop-above"))dragGroup.insertBefore(dragRow,target);
        else dragGroup.insertBefore(dragRow,target.nextSibling);
        renumberSeqs(dragGroup);saveTeaOrder(dragGroup.dataset.prefix,dragGroup);
      }
      dragGroup.querySelectorAll(".tea-row").forEach(function(r){r.classList.remove("drop-above","drop-below");});
      dragRow.classList.remove("dragging");
      if(ghost){ghost.remove();ghost=null;}
    }
    dragRow=null;dragGroup=null;isDragging=false;
  });
})();
