function updateTimeLine(mins){
  if(!timeLineEl||state.tab!=="runbook"){if(timeLineEl)timeLineEl.style.display="none";return;}
  var lastAbove=null;
  for(var i=0;i<evNodes.length;i++){var el=evNodes[i];if(el.classList.contains("hidden"))continue;var sm=parseInt(el.dataset.startMin);if(!isNaN(sm)&&sm<=mins)lastAbove=el;}
  if(lastAbove&&lastAbove.offsetParent!==null){timeLineEl.style.display="block";var r=lastAbove.getBoundingClientRect(),pr=timeLineEl.parentElement.getBoundingClientRect();timeLineEl.style.top=(r.bottom-pr.top)+"px";}
  else{timeLineEl.style.display="none";}
}

var MARCH=12*60+15,lastClockMin=-1;
function updateClock(){
  var now=new Date(),h=String(now.getHours()).padStart(2,"0"),m=String(now.getMinutes()).padStart(2,"0"),se=String(now.getSeconds()).padStart(2,"0");
  $("clock").textContent=h+":"+m+":"+se;
  var mins=getNowMins(),diff=MARCH-mins;
  $("march-cd").textContent=diff>0?"距離進場: "+fmtCd(diff):diff===0?"🌸 進場時間！":"已進場 "+fmtCd(-diff);
  var phase=mins<495?"早上準備":mins<525?"接新娘":mins<645?"敬茶":mins<690?"過渡":mins<930?"迎賓＋午宴":"收場";
  $("phase-now").textContent=phase;
  if(mins!==lastClockMin){lastClockMin=mins;requestAnimationFrame(function(){updateTimeLine(mins);});}
}

teaPage.addEventListener("click",function(e){var row=e.target.closest(".tea-row");if(!row)return;var key=row.dataset.key;if(!key)return;teaDone[key]=!teaDone[key];row.classList.toggle("done",teaDone[key]);var ck=row.querySelector(".check");if(ck){ck.classList.toggle("checked",teaDone[key]);ck.textContent=teaDone[key]?"✓":"";}saveTeaDone();});

addTeaSec("女家敬茶（5組·~30min·caller=匡·TK=小燕）",TEA_B,"#C4928E","B");
addTeaSec("男家敬茶（10組·~55min·Grace→匡·TK=Jonathan）",TEA_G,"#4A5A23","G");
addTeaSec("補敬茶（固定3組·上菜後·caller=匡）",TEA_S,"#8B7399","S");

var matDone={};
try{var md3=sessionStorage.getItem("wops_mat");if(md3)matDone=JSON.parse(md3);}catch(e){}
function saveMatDone(){try{sessionStorage.setItem("wops_mat",JSON.stringify(matDone));}catch(e){}}

var matPage=document.createElement("div");matPage.id="page-materials";matPage.className="page"+(state.tab==="materials"?" active":"");

var matFb=document.createElement("div");matFb.className="filter-bar show";matFb.id="mat-filter-bar";matFb.style.cssText="padding:6px 16px;border-bottom:1px solid var(--border);overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch;display:block";
var matFilterActive="全部";
try{var mfa2=sessionStorage.getItem("wops_mf");if(mfa2)matFilterActive=mfa2;}catch(e){}
function saveMF(){try{sessionStorage.setItem("wops_mf",matFilterActive);}catch(e){}}
owners.forEach(function(o){var b=document.createElement("span");b.className="fbtn"+(matFilterActive===o?" active":"");b.textContent=o;b.onclick=function(){matFb.querySelectorAll(".fbtn").forEach(function(x){x.classList.remove("active");});b.classList.add("active");matFilterActive=o;filterMat();saveMF();};matFb.appendChild(b);});
matPage.appendChild(matFb);

var matNodes=[];
MAT.forEach(function(m){var key=m.id;var isDone=matDone[key]||false;var d=document.createElement("div");d.className="mat-row"+(isDone?" done":"");d.dataset.key=key;d.dataset.owner=m.ow;var fsCl=["帶走","收回","取回","Lan帶走"].indexOf(m.fs)>=0?"keep":["用完","棄","拋出","派完","飲完","食完"].indexOf(m.fs)>=0?"gone":"ret";var extra="";if(m.st||m.mv||m.fl||m.ht)extra='<div class="mflow">'+(m.st||"")+(m.mv?" → "+m.mv:"")+(m.fl?" → "+m.fl:"")+(m.ht?" · 交接:"+m.ht:"")+"</div>";if(m.nt)extra+='<div class="mnote">'+m.nt+'</div>';if(m.cp)extra+='<div class="mcp">⏰ '+m.cp+'</div>';d.innerHTML='<div class="check'+(isDone?" checked":"")+'">'+( isDone?"✓":"")+'</div><div class="mid">'+m.id+'</div><div class="minfo"><div class="mnm">'+m.nm+'</div><div class="mow">'+m.ow+'</div>'+extra+'</div><div class="mfs '+fsCl+'">'+m.fs+'</div>';matPage.appendChild(d);matNodes.push(d);});
matPage.addEventListener("click",function(e){var row=e.target.closest(".mat-row");if(!row)return;var key=row.dataset.key;if(!key)return;matDone[key]=!matDone[key];row.classList.toggle("done",matDone[key]);var ck=row.querySelector(".check");if(ck){ck.classList.toggle("checked",matDone[key]);ck.textContent=matDone[key]?"✓":"";}saveMatDone();});
function filterMat(){matNodes.forEach(function(el){if(matFilterActive==="全部"){el.classList.remove("hidden");return;}el.classList.toggle("hidden",(el.dataset.owner||"").indexOf(matFilterActive)===-1);});}
filterMat();
